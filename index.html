ss="muted small" style="text-align:center">${hours(dayHours())} focused hours today · ${daySessions().length} completed sessions</p><div class="subjectrow"><b>Completed focus sessions</b><span style="float:right">${daySessions().length}</span></div><div class="subjectrow"><b>Focus target</b><span style="float:right">${db.targets.pomodoro} sessions</span></div><div class="subjectrow"><b>Break time today</b><span style="float:right">${db.sessions.filter(s=>s.date===dateStr()).reduce((a,s)=>a+(s.breakMinutes||0),0)} min</span></div></div></div><div class="card" style="margin-top:15px">${heading('Session history','Completed, interrupted and abandoned sessions')}<div class="tablewrap"><table><thead><tr><th>Date</th><th>Subject</th><th>Chapter</th><th>Revision</th><th>Activity</th><th>Focus</th><th>Status</th><th>Notes</th></tr></thead><tbody>${db.sessions.slice().reverse().slice(0,30).map(s=>`<tr><td>${s.date}</td><td>${s.subject}</td><td>${esc(db.chapters.find(c=>c.id===s.chapter)?.name||'—')}</td><td>${s.revision}</td><td>${s.activity}</td><td>${s.minutes}m</td><td>${s.status}</td><td>${esc(s.notes||'')}</td></tr>`).join('')||'<tr><td colspan="8" class="empty">Your focus history will appear here.</td></tr>'}</tbody></table></div></div>`}
function mocks(){return `${heading('Mock test performance','Track full papers, ICAI MTPs and chapter tests')}<div class="toolbar"><button class="btn" onclick="openMock()">＋ Add mock test</button></div><div class="grid stats">${stat('Tests attempted',db.mocks.length,'All formats')}${stat('Average score',db.mocks.length?Math.round(db.mocks.reduce((a,m)=>a+m.marks/Math.max(1,m.max)*100,0)/db.mocks.length)+'%':'—','Percentage average')}${stat('Highest score',db.mocks.length?Math.max(...db.mocks.map(m=>Math.round(m.marks/Math.max(1,m.max)*100)))+'%':'—','Best attempt')}${stat('Lowest score',db.mocks.length?Math.min(...db.mocks.map(m=>Math.round(m.marks/Math.max(1,m.max)*100)))+'%':'—','Lowest attempt')}</div><div class="card tablewrap"><table><thead><tr><th>Test</th><th>Subject</th><th>Date</th><th>Marks</th><th>Percentage</th><th>Time</th><th>Weak chapters</th><th>Mistakes</th><th></th></tr></thead><tbody>${db.mocks.map(m=>`<tr><td>${esc(m.name)}</td><td>${m.subject}</td><td>${m.date}</td><td>${m.marks}/${m.max}</td><td>${pct(m.marks,m.max)}%</td><td>${m.time||'—'}</td><td>${esc(m.weak||'—')}</td><td>${esc(m.mistakes||'—')}</td><td><button class="linkbtn" onclick="del('mocks','${m.id}')">×</button></td></tr>`).join('')||'<tr><td colspan="9" class="empty">No mock tests recorded yet.</td></tr>'}</tbody></table></div>`}

function analytics(){let total=db.chapters.length*4,done=db.chapters.reduce((a,c)=>a+c.revisions.filter(r=>r.done).length,0),week=new Date();week.setDate(week.getDate()-6);let days=Array.from({length:7},(_,i)=>{let d=new Date(week);d.setDate(d.getDate()+i);return dateStr(d)});return `${heading('Analytics','Progress from your actual records, not decorative demo data')}<div class="grid stats">${stat('Revision completion',pct(done,total)+'%',done+' / '+total+' chapter cycles')}${stat('Total focused time',hours(db.sessions.filter(s=>s.status!=='Abandoned').reduce((a,s)=>a+s.minutes,0)/60)+'h','Across all sessions')}${stat('Practice completion',pct(db.practice.filter(x=>x.status==='Completed').length,db.practice.length)+'%','RTP, MTP and PYQ records')}${stat('Mistakes resolved',db.mistakes.filter(m=>m.status==='Resolved').length,'Of '+db.mistakes.length+' logged')}</div><div class="grid cols"><div class="card">${heading('Subject revision progress')} ${subjects.map(s=>{let cs=db.chapters.filter(c=>c.subject===s),n=cs.length*4,d=cs.reduce((a,c)=>a+c.revisions.filter(r=>r.done).length,0);return `<div class="subjectrow"><div class="rowtop"><b>${s}</b><span>${pct(d,n)}%</span></div><div class="progress"><span style="width:${pct(d,n)}%"></span></div></div>`}).join('')}</div><div class="card">${heading('Focused hours · last 7 days')}<div class="chartbars">${days.map(d=>{let h=dayHours(d);return `<div class="barwrap"><div class="bar" style="height:${Math.max(2,h/Math.max(1,...days.map(dayHours))*110)}px"></div>${new Date(d+'T00:00:00').toLocaleDateString('en-IN',{weekday:'short'})}<br>${hours(h)}h</div>`}).join('')}</div></div></div><div class="card" style="margin-top:15px">${heading('Subject focus distribution')}<div class="grid" style="grid-template-columns:repeat(4,1fr)">${subjects.map(s=>{let h=subjectProgress(s).hours;return `<div><div class="statnum">${hours(h)}h</div><div class="muted small">${s}</div></div>`}).join('')}</div></div>`}
function calendar(){let month=calMonth,y=month.getFullYear(),m=month.getMonth(),first=new Date(y,m,1).getDay(),count=new Date(y,m+1,0).getDate();return `${heading('Calendar','Monthly overview of scheduled study tasks')}<div class="toolbar"><button class="btn secondary" onclick="changeMonth(-1)">← Previous</button><b style="padding:9px">${month.toLocaleDateString('en-IN',{month:'long',year:'numeric'})}</b><button class="btn secondary" onclick="changeMonth(1)">Next →</button></div><div class="calendargrid">${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(x=>`<div class="muted small" style="text-align:center">${x}</div>`).join('')}${Array(first).fill('<div></div>').join('')}${Array.from({length:count},(_,i)=>{let d=`${y}-${String(m+1).padStart(2,'0')}-${String(i+1).padStart(2,'0')}`,ts=db.tasks.filter(t=>t.date===d);return `<div class="calday" onclick="quickTask('${d}')"><b>${i+1}</b>${ts.slice(0,2).map(t=>`<div style="margin-top:5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap"><i class="dot"></i>${esc(t.title)}</div>`).join('')}${ts.length>2?`<div class="muted">+${ts.length-2} more</div>`:''}</div>`}).join('')}</div><p class="muted small">Tap a date to add a task. Use the planner to edit or reschedule existing tasks.</p>`}

cords as CSV</button><p class="muted small">Excel can open the CSV export. JSON preserves all linked records and settings.</p></div></div><div class="card" style="margin-top:15px"><h2>Storage status</h2><div class="small muted">Autosave: active · Local browser storage · Schema: v1</div><div class="small muted" style="margin-top:7px">For syncing between iPad, iPhone and desktop, this single-file edition needs a cloud database and sign-in layer. Keep JSON backups when switching devices.</div><button class="btn danger" style="margin-top:14px" onclick="if(confirm('Delete ALL study data from this browser? Export a backup first.')){localStorage.removeItem('cainter_command_v1');location.reload()}">Reset all data</button></div>`}

function openTask(t){t=t?db.tasks.find(x=>x.id===t):{};modal(t.id?'Edit study task':'Add study task',`<div class="formgrid"><div class="wide"><label>Task title</label><input class="field" name="title" required value="${esc(t.title||'')}"></div><div><label>Subject</label><select class="field" name="subject">${subjects.map(s=>`<option ${t.subject===s?'selected':''}>${s}</option>`).join('')}</select></div><div><label>Chapter</label><select class="field" name="chapterId"><option value="">Subject level</option>${db.chapters.map(c=>`<option value="${c.id}" ${t.chapterId===c.id?'selected':''}>${c.subject} · ${esc(c.name)}</option>`).join('')}</select></div><div><label>Revision</label><select class="field" name="revision"><option value="">Not specified</option>${[1,2,3,4].map(n=>`<option ${t.revision==n?'selected':''}>${n}</option>`).join('')}</select></div><div><label>Activity</label><select class="field" name="activity">${['Lectures','Reading','Conceptual study','Question practice','RTP','MTP','PYQ','Formula revision','Mock test'].map(x=>`<option ${t.activity===x?'selected':''}>${x}</option>`).join('')}</select></div><div><label>Date</label><input class="field" type="date" name="date" value="${t.date||dateStr()}"></div><div><label>Planned hours</label><input class="field" type="number" min="0" step=".25" name="hours" value="${t.hours||1}"></div><div><label>Actual hours</label><input class="field" type="number" min="0" step=".25" name="actual" value="${t.actual||0}"></div><div><label>Priority</label><select class="field" name="priority">${['High','Normal','Low'].map(x=>`<option ${t.priority===x?'selected':''}>${x}</option>`).join('')}</select></div><div><label>Status</label><select class="field" name="status">${['Pending','Partial','Completed'].map(x=>`<option ${t.status===x?'selected':''}>${x}</option>`).join('')}</select></div></div>`,()=>{let x={id:t.id||id(),title:val('title'),subject:val('subject'),chapterId:val('chapterId'),revision:val('revision'),activity:val('activity'),date:val('date'),hours:+val('hours'),actual:+val('actual'),priority:val('priority'),status:val('status')};if(!x.title)return false;if(t.id)Object.assign(t,x);else db.tasks.push(x);save();render();return true})}
function editTask(id){openTask(id)}
function toggleTask(id){
  let t=db.tasks.find(x=>x.id===id);
  if(!t)return;
  const wasCompleted = t.status==='Completed';
  t.status = wasCompleted ? 'Pending' : 'Completed';
  if(!wasCompleted && t.status==='Completed' && t.chapterId && !t.autoGenerated){
    const day3 = addDays(dateStr(), 3);
    const key = `day3-revise-${t.chapterId}-${dateStr()}`;
    const existing = db.tasks.find(x => x.autoKey === key);
    if(!existing){
      const ch = db.chapters.find(c => c.id === t.chapterId);
      db.tasks.push({
        id: id(),
        autoKey: key,
        title: `📌 Day 3 Revision · ${ch ? ch.name : t.title}`,
        subject: t.subject || (ch && ch.subject) || '',
        chapterId: t.chapterId,
        revision: t.revision || '',
        activity: 'Revision',
        date: day3,
        hours: 0.5,
        actual: 0,
        priority: 'High',
        status: 'Pending',
        autoGenerated: true,
        sourceTaskId: t.id
      });
      toast('Day 3 revision reminder added to your planner');
    }
  }
  if(wasCompleted && t.status==='Pending'){
    db.tasks.forEach(x => {
      if(x.sourceTaskId === t.id && x.status !== 'Completed') x.status = 'Cancelled';
    });
  }
  save();
  render();
}
function updateTask(id,k,v){let t=db.tasks.find(x=>x.id===id);t[k]=v;save();render()}
function addDays(date,days){let d=new Date(date+'T12:00:00');d.setDate(d.getDate()+days);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function toggleWritingPractice(cid,checked){
 let c=db.chapters.find(x=>x.id===cid);if(!c)return;
 if(!['Costing','FM'].includes(c.subject))return;
 c.writingPracticeDone=checked;
 c.writingPracticeDate=checked?dateStr():null;
 c.writingPracticeReminderIds=c.writingPracticeReminderIds||[];
 if(checked){
  [1,3].forEach(day=>{
   const key=`writing-${cid}-${c.writingPracticeDate}-day${day}`;
   const existing=db.tasks.find(t=>t.autoKey===key);
   if(existing){existing.status='Pending';existing.date=addDays(c.writingPracticeDate,day);}
   else{
    const task={id:id(),autoKey:key,title:`📌 Day ${day} Writing Practice Repeat · ${c.name}`,subject:c.subject,chapterId:cid,revision:'',activity:'Writing practice',date:addDays(c.writingPracticeDate,day),hours:0.5,actual:0,priority:'High',status:'Pending',autoGenerated:true};
    db.tasks.push(task);c.writingPracticeReminderIds.push(task.id);
   }
  });
  toast('Writing practice done. Day 1 + Day 3 revision reminders added to your planner.');
 }else{
  db.tasks.forEach(t=>{if(c.writingPracticeReminderIds.includes(t.id)&&t.status!=='Completed')t.status='Cancelled'});
  toast('Writing practice unticked. Unfinished reminders cancelled.');
 }
 save();render();

 const quote=celebrationQuotes[Math.floor(Math.random()*celebrationQuotes.length)];
 if($('#celebrateMessage'))$('#celebrateMessage').textContent=`${hours(actual)} of ${hours(target)} focused hours completed. You hit your daily study target!`;
 if($('#celebrateQuote'))$('#celebrateQuote').textContent='“'+quote+'”';
 const confetti=$('#confetti');if(confetti)confetti.innerHTML=Array.from({length:42},(_,i)=>`<i style="left:${(i*37)%100}%;animation-delay:${(i%9)*-.23}s;transform:rotate(${i*29}deg)"></i>`).join('');
 if($('#celebrateBackdrop'))$('#celebrateBackdrop').style.display='flex';
}
function closeCelebration(){if($('#celebrateBackdrop'))$('#celebrateBackdrop').style.display='none'}
