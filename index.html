<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CA Inter Tracker - Fully Loaded</title>
    <style>
        :root {
            --bg: #0b0f19;
            --card: rgba(255, 255, 255, 0.03);
            --border: rgba(255, 255, 255, 0.07);
            --text: #f3f4f6;
            --text-muted: #9ca3af;
            --blue: #3b82f6;
            --emerald: #10b981;
            --orange: #f97316;
            --red: #ef4444;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { background-color: var(--bg); color: var(--text); display: flex; min-height: 100vh; }
        
        /* Layout Sidebar & Main Content */
        aside { width: 240px; background: rgba(10, 15, 30, 0.8); border-r: 1px solid var(--border); border-right: 1px solid var(--border); padding: 20px; display: flex; flex-direction: column; gap: 20px; }
        main { flex: 1; padding: 24px; max-width: 1000px; width: 100%; margin: 0 auto; overflow-y: auto; }
        
        .brand h1 { font-size: 1.1rem; font-weight: 700; color: #fff; }
        .brand p { font-size: 0.75rem; color: var(--text-muted); }
        
        .nav-btn { width: 100%; text-align: left; padding: 10px 12px; background: none; border: none; color: var(--text-muted); border-radius: 8px; font-size: 0.9rem; font-weight: 500; cursor: pointer; transition: all 0.2s; margin-bottom: 4px; }
        .nav-btn.active, .nav-btn:hover { background: rgba(59, 130, 246, 0.15); color: var(--blue); }
        
        .view-section { display: none; }
        .view-section.active { display: block; }
        
        /* Universal Cards & Grid */
        .grid-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; margin-bottom: 24px; }
        .card { background: var(--card); border: 1px solid var(--border); padding: 16px; border-radius: 12px; }
        .card p { font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; }
        .card h2 { font-size: 1.75rem; font-weight: 800; margin-top: 4px; }
        
        .box { background: var(--card); border: 1px solid var(--border); padding: 20px; border-radius: 12px; margin-bottom: 20px; }
        .box h3 { font-size: 1rem; font-weight: 600; margin-bottom: 16px; color: #fff; }
        
        /* Subjects View */
        .subj-row { margin-bottom: 16px; }
        .subj-meta { display: flex; justify-content: space-between; font-size: 0.85rem; margin-bottom: 6px; }
        .bar-bg { width: 100%; background: rgba(255,255,255,0.05); height: 8px; border-radius: 4px; overflow: hidden; }
        .bar-fill { height: 100%; background: var(--blue); width: 0%; transition: width 0.4s ease; }
        
        /* Pomodoro Engine */
        .timer-display { font-size: 4rem; font-weight: 800; text-align: center; margin: 20px 0; font-variant-numeric: tabular-nums; color: var(--orange); }
        .timer-controls { display: flex; gap: 12px; }
        
        /* Utilities forms */
        select, input, textarea { width: 100%; padding: 10px; background: #111827; border: 1px solid var(--border); color: #fff; border-radius: 8px; font-size: 0.9rem; margin-bottom: 12px; }
        button.action-btn { background: var(--blue); border: none; color: white; padding: 10px; border-radius: 8px; font-weight: 600; cursor: pointer; width: 100%; }
        button.action-btn:active { opacity: 0.8; }
        
        /* List nodes */
        .item-list { list-style: none; space-y: 8px; }
        .list-item { display: flex; justify-content: space-between; align-items: center; padding: 10px; background: rgba(255,255,255,0.02); border: 1px solid var(--border); border-radius: 8px; margin-bottom: 8px; font-size: 0.9rem; }
        .list-item.completed span { text-decoration: line-through; color: var(--text-muted); }
        .delete-btn { background: none; border: none; color: var(--red); font-size: 0.8rem; cursor: pointer; }
    </style>
</head>
<body>

    <aside>
        <div class="brand">
            <h1>CA Inter Tracker</h1>
            <p>Syllabus Registry</p>
        </div>
        <nav>
            <button class="nav-btn active" onclick="switchView('dashboard')">Dashboard</button>
            <button class="nav-btn" onclick="switchView('pomodoro')">Pomodoro Timer</button>
            <button class="nav-btn" onclick="switchView('tasks')">Task Matrix</button>
            <button class="nav-btn" onclick="switchView('notes')">Scratch Ledger</button>
        </nav>
    </aside>

    <main>
        <div id="dashboard" class="view-section active">
            <div class="grid-stats">
                <div class="card"><p>Total Hours</p><h2 id="dash-total" style="color:var(--blue)">0.0h</h2></div>
                <div class="card"><p>Target Goal</p><h2>920h</h2></div>
                <div class="card"><p>Pomodoros</p><h2 id="dash-pomo" style="color:var(--orange)">0</h2></div>
            </div>

            <div class="box">
                <h3>Syllabus Progress Tracker</h3>
                <div id="subjects-wrapper"></div>
            </div>

            <div class="box">
                <h3>Log Study Session Metric</h3>
                <select id="log-sub">
                    <option value="aa">Advanced Accounting (200h)</option>
                    <option value="law">Corporate and Other Laws (150h)</option>
                    <option value="tax">Taxation (IT + GST) (200h)</option>
                    <option value="cma">Cost & Management Accounting (150h)</option>
                    <option value="audit">Auditing and Ethics (100h)</option>
                    <option value="fmsm">FM & Strategic Management (120h)</option>
                </select>
                <input type="number" id="log-hrs" step="0.5" placeholder="Hours logged (e.g. 3.5)">
                <button class="action-btn" onclick="addStudyHours()">Commit Session Metrics</button>
            </div>
        </div>

        <div id="pomodoro" class="view-section">
            <div class="box">
                <h3>Focus Countdown Engine</h3>
                <div class="timer-display" id="timer-clock">25:00</div>
                <div class="timer-controls">
                    <button class="action-btn" style="background:var(--emerald)" onclick="startTimer()">Start</button>
                    <button class="action-btn" style="background:var(--orange)" onclick="pauseTimer()">Pause</button>
                    <button class="action-btn" style="background:rgba(255,255,255,0.1)" onclick="resetTimer()">Reset</button>
                </div>
            </div>
        </div>

        <div id="tasks" class="view-section">
            <div class="box">
                <h3>Milestone Tasks Checklist</h3>
                <input type="text" id="task-input" placeholder="Enter chapter task milestone...">
                <button class="action-btn" onclick="addTaskItem()">Queue Task Node</button>
                <ul id="task-list" class="item-list" style="margin-top: 16px;"></ul>
            </div>
        </div>

        <div id="notes" class="view-section">
            <div class="box">
                <h3>Revision Scratch Ledger</h3>
                <textarea id="note-input" rows="4" placeholder="Jot down formulas, sections, or quick reminders..."></textarea>
                <button class="action-btn" onclick="addNoteItem()">Save Ledger Entry</button>
                <div id="notes-list" style="margin-top: 16px;"></div>
            </div>
        </div>
    </main>

    <script>
        // Core State Store
        let state = {
            hours: { aa: 0, law: 0, tax: 0, cma: 0, audit: 0, fmsm: 0 },
            targets: { aa: 200, law: 150, tax: 200, cma: 150, audit: 100, fmsm: 120 },
            names: { aa: "Advanced Accounting", law: "Corporate and Other Laws", tax: "Taxation (IT + GST)", cma: "Cost & Management Accounting", audit: "Auditing and Ethics", fmsm: "FM & Strategic Management" },
            pomodoros: 0,
            tasks: [],
            notes: []
        };

        // Navigation Engine
        function switchView(viewId) {
            document.querySelectorAll('.view-section').forEach(v => v.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(viewId).classList.add('active');
            event.currentTarget.classList.add('active');
        }

        // Global Data Hydration
        function loadStorage() {
            const stored = localStorage.getItem('ca_loaded_state');
            if (stored) { state = JSON.parse(stored); }
            renderAll();
        }

        function saveStorage() {
            localStorage.setItem('ca_loaded_state', JSON.stringify(state));
        }

        function renderAll() {
            // Render Progress Elements
            const wrapper = document.getElementById('subjects-wrapper');
            wrapper.innerHTML = '';
            let total = 0;
            
            Object.keys(state.hours).forEach(k => {
                const done = state.hours[k];
                const target = state.targets[k];
                total += done;
                const pct = Math.min(100, Math.round((done / target) * 100));
                
                wrapper.innerHTML += `
                    <div class="subj-row">
                        <div class="subj-meta">
                            <span>${state.names[k]}</span>
                            <span style="color:var(--text-muted)">${done.toFixed(1)} / ${target}h (${pct}%)</span>
                        </div>
                        <div class="bar-bg">
                            <div class="bar-fill" style="width: ${pct}%"></div>
                        </div>
                    </div>
                `;
            });

            document.getElementById('dash-total').innerText = total.toFixed(1) + 'h';
            document.getElementById('dash-pomo').innerText = state.pomodoros;

            // Render Checklist Nodes
            const tList = document.getElementById('task-list');
            tList.innerHTML = '';
            state.tasks.forEach((t, i) => {
                tList.innerHTML += `
                    <li class="list-item ${t.done ? 'completed' : ''}">
                        <span onclick="toggleTask(${i})" style="cursor:pointer; flex:1;">${t.text}</span>
                        <button class="delete-btn" onclick="deleteTask(${i})">Remove</button>
                    </li>
                `;
            });

            // Render Ledger Entry Nodes
            const nList = document.getElementById('notes-list');
            nList.innerHTML = '';
            state.notes.forEach((n, i) => {
                nList.innerHTML += `
                    <div class="list-item" style="flex-direction:column; align-items:flex-start; gap:8px;">
                        <p style="color:#fff; white-space:pre-wrap; width:100%;">${n}</p>
                        <button class="delete-btn" onclick="deleteNote(${i})" style="align-self:flex-end;">Delete Node</button>
                    </div>
                `;
            });
        }

        // Core Functions
        function addStudyHours() {
            const sub = document.getElementById('log-sub').value;
            const h = parseFloat(document.getElementById('log-hrs').value);
            if (!isNaN(h) && h > 0) {
                state.hours[sub] += h;
                document.getElementById('log-hrs').value = '';
                saveStorage(); renderAll();
            }
        }

        function addTaskItem() {
            const val = document.getElementById('task-input').value.trim();
            if (val) {
                state.tasks.push({ text: val, done: false });
                document.getElementById('task-input').value = '';
                saveStorage(); renderAll();
            }
        }
        function toggleTask(i) { state.tasks[i].done = !state.tasks[i].done; saveStorage(); renderAll(); }
        function deleteTask(i) { state.tasks.splice(i, 1); saveStorage(); renderAll(); }

        function addNoteItem() {
            const val = document.getElementById('note-input').value.trim();
            if (val) {
                state.notes.push(val);
                document.getElementById('note-input').value = '';
                saveStorage(); renderAll();
            }
        }
        function deleteNote(i) { state.notes.splice(i, 1); saveStorage(); renderAll(); }

        // Pomodoro Engine Mechanism
        let timerInterval = null;
        let timeRemaining = 25 * 60;

        function updateTimerDisplay() {
            const m = Math.floor(timeRemaining / 60).toString().padStart(2, '0');
            const s = (timeRemaining % 60).toString().padStart(2, '0');
            document.getElementById('timer-clock').innerText = `${m}:${s}`;
        }

        function startTimer() {
            if (timerInterval) return;
            timerInterval = setInterval(() => {
                if (timeRemaining > 0) {
                    timeRemaining--;
                    updateTimerDisplay();
                } else {
                    clearInterval(timerInterval);
                    timerInterval = null;
                    timeRemaining = 25 * 60;
                    state.pomodoros += 1;
                    updateTimerDisplay();
                    saveStorage(); renderAll();
                    alert("Focus sprint complete! Grab a break node.");
                }
            }, 1000);
        }

        function pauseTimer() { clearInterval(timerInterval); timerInterval = null; }
        function resetTimer() { pauseTimer(); timeRemaining = 25 * 60; updateTimerDisplay(); }

        // Initialize Workspace
        loadStorage();
    </script>
</body>
</html>
