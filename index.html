<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CA Inter Tracker</title>
    <style>
        :root {
            --bg: #0b0f19;
            --card: rgba(255, 255, 255, 0.03);
            --border: rgba(255, 255, 255, 0.08);
            --text: #f3f4f6;
            --text-muted: #9ca3af;
            --blue: #3b82f6;
            --emerald: #10b981;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { background-color: var(--bg); color: var(--text); padding: 16px; }
        header { margin-bottom: 24px; border-bottom: 1px solid var(--border); padding-bottom: 12px; }
        h1 { font-size: 1.25rem; font-weight: 700; color: #fff; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 24px; }
        .card { background: var(--card); border: 1px solid var(--border); padding: 14px; rounded-radius: 12px; border-radius: 12px; }
        .card p { font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; }
        .card h2 { font-size: 1.5rem; font-weight: 800; margin-top: 4px; color: var(--blue); }
        .subj-card { background: var(--card); border: 1px solid var(--border); padding: 16px; border-radius: 12px; margin-bottom: 12px; }
        .subj-header { display: flex; justify-content: space-between; font-size: 0.85rem; margin-bottom: 8px; font-weight: 600; }
        .progress-bar-bg { width: 100%; bg: rgba(255,255,255,0.05); background: rgba(255,255,255,0.05); h: 8px; height: 8px; border-radius: 4px; overflow: hidden; }
        .progress-bar { height: 100%; background: var(--blue); border-radius: 4px; width: 0%; transition: width 0.3s; }
        .log-box { background: var(--card); border: 1px solid var(--border); padding: 16px; border-radius: 12px; margin-top: 24px; }
        select, input, button { width: 100%; padding: 10px; margin-top: 8px; background: #111827; border: 1px solid var(--border); color: #fff; border-radius: 8px; font-size: 0.9rem; }
        button { background: var(--blue); border: none; font-weight: 600; cursor: pointer; margin-top: 12px; }
        button:active { opacity: 0.9; }
    </style>
</head>
<body>

    <header>
        <h1>CA Inter Study Tracker</h1>
    </header>

    <div class="grid">
        <div class="card"><p>Total Hours</p><h2 id="total-hrs">0.0h</h2></div>
        <div class="card"><p>Target</p><h2>920h</h2></div>
        <div class="card"><p>Papers</p><h2>6 Total</h2></div>
    </div>

    <div id="subjects-container"></div>

    <div class="log-box">
        <h3 style="font-size:0.9rem; font-weight:600;">Log Study Session</h3>
        <select id="sub-select">
            <option value="aa">Advanced Accounting (200h)</option>
            <option value="law">Corporate and Other Laws (150h)</option>
            <option value="tax">Taxation (IT + GST) (200h)</option>
            <option value="cma">Cost & Management Accounting (150h)</option>
            <option value="audit">Auditing and Ethics (100h)</option>
            <option value="fmsm">FM & Strategic Management (120h)</option>
        </select>
        <input type="number" id="hrs-input" step="0.5" placeholder="Hours studied (e.g. 2.5)">
        <button onclick="logHours()">Log Hours</button>
    </div>

    <script>
        const subjects = {
            aa: { name: "Advanced Accounting", target: 200, done: 0 },
            law: { name: "Corporate and Other Laws", target: 150, done: 0 },
            tax: { name: "Taxation (IT + GST)", target: 200, done: 0 },
            cma: { name: "Cost & Management Accounting", target: 150, done: 0 },
            audit: { name: "Auditing and Ethics", target: 100, done: 0 },
            fmsm: { name: "FM & Strategic Management", target: 120, done: 0 }
        };

        function init() {
            const saved = localStorage.getItem('ca_inter_data');
            if (saved) {
                const parsed = JSON.parse(saved);
                Object.keys(parsed).forEach(k => { if(subjects[k]) subjects[k].done = parsed[k].done || 0; });
            }
            render();
        }

        function render() {
            const container = document.getElementById('subjects-container');
            container.innerHTML = '';
            let total = 0;

            Object.keys(subjects).forEach(k => {
                const s = subjects[k];
                total += s.done;
                const pct = Math.min(100, Math.round((s.done / s.target) * 100));
                
                container.innerHTML += `
                    <div class="subj-card">
                        <div class="subj-header">
                            <span>${s.name}</span>
                            <span style="color:#9ca3af">${s.done.toFixed(1)} / ${s.target}h (${pct}%)</span>
                        </div>
                        <div class="progress-bar-bg">
                            <div class="progress-bar" style="width: ${pct}%"></div>
                        </div>
                    </div>
                `;
            });

            document.getElementById('total-hrs').innerText = total.toFixed(1) + 'h';
            localStorage.setItem('ca_inter_data', JSON.stringify(subjects));
        }

        function logHours() {
            const sub = document.getElementById('sub-select').value;
            const val = parseFloat(document.getElementById('hrs-input').value);
            if (!isNaN(val) && val > 0) {
                subjects[sub].done += val;
                document.getElementById('hrs-input').value = '';
                render();
            }
        }

        init();
    </script>
</body>
</html>
